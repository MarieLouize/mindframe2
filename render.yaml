services:
  - type: web
    name: mindframe-engine
    runtime: docker
    plan: free
    dockerContext: services/engine
    dockerfilePath: services/engine/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
